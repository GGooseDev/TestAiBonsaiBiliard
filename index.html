<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poole &mdash; 8-ball Pool (2-player vs Bot)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; font-family: Arial, Helvetica, sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* ---- HUD overlay (pointer-events:none so it never blocks aiming) ---- */
  #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff; user-select: none; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 22px; gap: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0)); pointer-events: none;
  }
  .topbar .lbl { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #86b7c9; }
  .topbar .val { font-size: 15px; font-weight: bold; text-shadow: 0 0 12px rgba(90,215,255,.8); }
  .groups { flex: 1; }
  .turn { text-align: right; }

  #break-hint { position: absolute; top: 56px; left: 0; right: 0; text-align: center; font-size: 14px; color: #9fd7ff; text-shadow: 0 0 10px rgba(0,0,0,.6); }

  /* message line near the bottom (canvas floats sit above it) */
  #msg { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 16px;
         color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.8); }

  /* centre controls (group pick + play again) */
  .controls { position: absolute; top: 46%; left: 0; right: 0; display: flex; justify-content: center;
              align-items: center; gap: 18px; transform: translateY(-50%); }

  button {
    pointer-events: auto; cursor: pointer; border-radius: 9px; font-weight: bold; font-size: 16px;
    color: #fff; padding: 11px 22px; letter-spacing: .03em;
    background: linear-gradient(180deg, #7a4a2f, #3a2413);
    border: 2px solid rgba(255, 240, 150, .45);
    box-shadow: 0 0 18px rgba(90,215,255,.3), 0 6px 14px rgba(0,0,0,.5);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(90,215,255,.5), 0 8px 16px rgba(0,0,0,.5); }
  button:active { transform: translateY(0); }

  /* Break-group picker: hidden until updateHUD makes it active. The inherited
     .controls transform keeps it vertically centered. JS (updateHUD) flips
     display/opacity/pointer-events so the invisible state also removes the
     phantom hit-tests that the button{pointer-events:auto} rule would leave. */
  .group-pick { opacity: 0; pointer-events: none; transition: opacity .15s ease; }

   /* "Play again" is only shown on game over (updateHUD sets style.display inline,
      which overrides this rule). Default to hidden so it never flashes before the
      first HUD update — and so a broken start() can't leave it stranded visible. */
   #play-again { display: none; }

   /* ---- game-over centre card (pointer-events:none so canvas clicks still restart) ---- */
   #gameover { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: none;
               flex-direction: row; align-items: center; justify-content: center; gap: 32px;
               background: rgba(5, 8, 11, .42); }
   #gameover[aria-busy="true"] { display: none; }
   .go-label { font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
               color: #86b7c9; text-shadow: 0 0 14px rgba(0,0,0,.8); }
   .go-name  { font-size: 44px; font-weight: bold; color: #fff;
               text-shadow: 0 0 32px rgba(90,215,255,.6), 0 6px 18px rgba(0,0,0,.8); }
 </style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="topbar">
    <div class="groups"><span class="lbl">Groups</span>&nbsp;&nbsp;<span class="val" id="groups">You: -&nbsp;Bot: -</span></div>
    <div class="turn"><span class="lbl">Turn</span><br><span class="val" id="turn" style="font-size:20px;">You</span></div>
  </div>

  <div id="break-hint">Drag from the cue to break.</div>

  <div id="msg">Break the rack &mdash; drag from the cue.</div>

    <div class="controls group-pick" id="group-pick-wrap">
    <button id="group-sol" title="Play solids (1-7)">SOLID</button>
    <button id="group-stri" title="Play stripes (9-15, black is 8)">STRIPE</button>
  </div>

  <div class="controls">
    <button id="play-again">Play again</button>
  </div>

  <!-- Game-over centre card: pointer-events:none so canvas clicks still
       restart; draw() flips display to flex only while state.gameOver. -->
  <div id="gameover" style="display:none;">
    <span class="go-label">Game over</span>
    <span class="go-name" id="go-name"></span>
  </div>
</div>

<!-- Classic <script src> modules, shared via window.Poole.
     Order matters (each module depends on the ones before it). THREE.js must
     load first; the 3D renderer (webgl3d.js) loads after UI. -->
<script src="lib/three.min.js"></script>
<script src="src/config.js"></script>
<script src="src/vec.js"></script>
<script src="src/ball.js"></script>
<script src="src/table.js"></script>
<script src="src/physics.js"></script>
<script src="src/rules.js"></script>
<script src="src/player.js"></script>
<script src="src/bot.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/webgl3d.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
