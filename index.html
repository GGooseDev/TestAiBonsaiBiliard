<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poole &mdash; 8-ball Pool (2-player vs Bot)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14233f; font-family: Arial, Helvetica, sans-serif; }
  canvas#game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* ---- HUD overlay (pointer-events:none so it never blocks aiming) ---- */
  #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff; user-select: none; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 22px; gap: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0)); pointer-events: none;
  }
  .topbar .lbl { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #86b7c9; }
  .topbar .val { font-size: 15px; font-weight: bold; text-shadow: 0 0 12px rgba(90,215,255,.8); }
  .groups { flex: 1; }
  .turn { text-align: right; }

  #break-hint { position: absolute; top: 56px; left: 0; right: 0; text-align: center; font-size: 14px; color: #9fd7ff; text-shadow: 0 0 10px rgba(0,0,0,.6); }

  /* message line near the bottom (canvas floats sit above it) */
  #msg { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 16px;
         color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.8); }

  /* centre controls (group pick + play again) */
  .controls { position: absolute; top: 46%; left: 0; right: 0; display: flex; justify-content: center;
              align-items: center; gap: 18px; transform: translateY(-50%); }

  button {
    pointer-events: auto; cursor: pointer; border-radius: 9px; font-weight: bold; font-size: 16px;
    color: #fff; padding: 11px 22px; letter-spacing: .03em;
    background: linear-gradient(180deg, #7a4a2f, #3a2413);
    border: 2px solid rgba(255, 240, 150, .45);
    box-shadow: 0 0 18px rgba(90,215,255,.3), 0 6px 14px rgba(0,0,0,.5);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(90,215,255,.5), 0 8px 16px rgba(0,0,0,.5); }
  button:active { transform: translateY(0); }

  /* Break-group picker: hidden until updateHUD makes it active. The inherited
     .controls transform keeps it vertically centered. JS (updateHUD) flips
     display/opacity/pointer-events so the invisible state also removes the
     phantom hit-tests that the button{pointer-events:auto} rule would leave. */
  .group-pick { opacity: 0; pointer-events: none; transition: opacity .15s ease; }

   /* "Play again" is only shown on game over (updateHUD sets style.display inline,
      which overrides this rule). Default to hidden so it never flashes before the
      first HUD update — and so a broken start() can't leave it stranded visible. */
   #play-again { display: none; }

   /* ---- game-over centre card (pointer-events:none so canvas clicks still restart) ---- */
   #gameover { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: none;
               flex-direction: row; align-items: center; justify-content: center; gap: 32px;
               background: rgba(5, 8, 11, .42); }
   #gameover[aria-busy="true"] { display: none; }
   .go-label { font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
               color: #86b7c9; text-shadow: 0 0 14px rgba(0,0,0,.8); }
    .go-name  { font-size: 44px; font-weight: bold; color: #fff;
                text-shadow: 0 0 32px rgba(90,215,255,.6), 0 6px 18px rgba(90,215,255,.8); }

    /* temporary debug: which webgl3d.js build is actually executing */
    #dbg-version { position: fixed; bottom: 4px; right: 10px; z-index: 10;
                   font-size: 11px; color: rgba(255,255,255,.4); pointer-events: none; }

    /* ---- startup menu ------------------------------------------------------- */
    #menu-root { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; opacity: 1; transition: opacity .3s ease; }
    #menu-root.menu-exit { opacity: 0; pointer-events: none; }
    /* The in-game WebGL scene (table + warm shimmering bokeh) renders behind the menu
       on #game. Keep this canvas fully transparent so it never covers that live backdrop. */
    #menu-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: none; }
    #menu-ink { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(26px, 4.5vh, 68px); pointer-events: none; user-select: none; text-align: center; }
    .menu-title { margin: 0; font-family: "Arial Black", Impact, "Franklin Gothic Bold", Arial, sans-serif; font-weight: 900; font-size: clamp(27px, 6.25vw, 84px); transform: translateY(-12%); line-height: 0.95; letter-spacing: .03em; text-transform: uppercase; color: #fff7ec;
                 text-shadow: 0 0 18px rgba(255, 140, 54, .9), 0 0 60px rgba(255, 90, 40, .6), 0 0 130px rgba(255, 60, 30, .35), 0 10px 40px rgba(0, 0, 0, .6); }
    .menu-sub { margin: 0; font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .42em; text-transform: uppercase; color: rgba(255, 222, 190, .78); text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
    .menu-items { display: flex; gap: clamp(12px, 2vw, 30px); pointer-events: auto; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
    .menu-item { --a: #ffd166; --g: rgba(255, 209, 102, .55);
                 font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: clamp(15px, 2vw, 21px); letter-spacing: .18em; text-transform: uppercase; color: #fff;
                 background: rgba(255, 246, 230, .07); border-radius: 999px; padding: 13px clamp(20px, 3.5vw, 40px); cursor: pointer;
                 border: 1px solid rgba(255, 246, 230, .35); box-shadow: 0 4px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .12);
                 transition: transform .09s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
    .menu-item:hover { transform: translateY(-3px); background: rgba(255, 246, 230, .13); border-color: var(--a); box-shadow: 0 8px 26px rgba(0, 0, 0, .5), 0 0 30px var(--g), inset 0 1px 0 rgba(255, 255, 255, .15); }
    .menu-item:active { transform: translateY(-1px); }
    .mi-classic { --a: #ff9b3a; --g: rgba(255, 155, 58, .55); }
    .mi-arena   { --a: #e02a4d; --g: rgba(224, 42, 77, .55); }
    .mi-viewer  { --a: #ffd166; --g: rgba(255, 209, 102, .55); }

    /* all in-game UI (topbar, hints, msg, group picker, play-again, game-over
       card) is hidden behind the menu overlay while it is shown */
    body.menu-open #hud { display: none; }

    /* ---- character viewer -------------------------------------------------- */
    .viewer-root { position: fixed; inset: 0; z-index: 40; opacity: 0; pointer-events: none;
                   transition: opacity .3s ease; background: #0e1c33; }
    .viewer-root.show { opacity: 1; pointer-events: auto; }
    #viewer-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .viewer-ui { position: absolute; left: 0; right: 0; bottom: clamp(16px, 4vh, 52px); display: flex;
                 justify-content: center; align-items: center; gap: clamp(8px, 1.4vw, 14px);
                 padding: 0 16px; flex-wrap: wrap; }
    .viewer-btn { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: clamp(12px, 1.5vw, 14px);
                  letter-spacing: .18em; text-transform: uppercase; color: #fff; cursor: pointer;
                  border-radius: 999px; padding: 10px clamp(16px, 3vw, 26px); border: 1px solid rgba(255, 246, 230, .35);
                  background: rgba(255, 246, 230, .07); box-shadow: 0 4px 18px rgba(0, 0, 0, .45),
                            inset 0 1px 0 rgba(255, 255, 255, .12); transition: transform .09s ease,
                  box-shadow .18s ease, border-color .18s ease, background .18s ease; }
    .viewer-btn:hover { transform: translateY(-2px); border-color: #ffd166;
                        box-shadow: 0 6px 24px rgba(0, 0, 0, .5), 0 0 24px rgba(255, 209, 102, .35),
                               inset 0 1px 0 rgba(255, 255, 255, .15); }
     .viewer-btn:active { transform: translateY(0); }
     /* highlighted state = mode currently selected (WALK/IDLE) */
     .viewer-btn.active { border-color: #ffd166; background: rgba(255, 209, 102, .18);
                          box-shadow: 0 6px 24px rgba(0, 0, 0, .5),
                                      0 0 24px rgba(255, 209, 102, .35),
                                      inset 0 1px 0 rgba(255, 255, 255, .15); }
    .viewer-hint { font-family: Arial, Helvetica, sans-serif; font-size: clamp(9px, 1.1vw, 12px);
                   letter-spacing: .3em; text-transform: uppercase; color: rgba(255, 222, 190, .55); }

    .menu-toast { position: absolute; bottom: clamp(28px, 5vh, 64px); left: 50%; transform: translateX(-50%); font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: clamp(13px, 1.6vw, 17px); letter-spacing: .3em; text-transform: uppercase; color: rgba(255, 235, 205, .9); text-shadow: 0 2px 14px rgba(0, 0, 0, .8); opacity: 0; transition: opacity .25s ease; }
    .menu-toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="dbg-version" aria-hidden="true"></div>

<div id="hud">
  <div class="topbar">
    <div class="groups"><span class="lbl">Groups</span>&nbsp;&nbsp;<span class="val" id="groups">You: -&nbsp;Bot: -</span></div>
    <div class="turn"><span class="lbl">Turn</span><br><span class="val" id="turn" style="font-size:20px;">You</span></div>
  </div>

  <div id="break-hint">Drag from the cue to break.</div>

  <div id="msg">Break the rack &mdash; drag from the cue.</div>

    <div class="controls group-pick" id="group-pick-wrap">
    <button id="group-sol" title="Play solids (1-7)">SOLID</button>
    <button id="group-stri" title="Play stripes (9-15, black is 8)">STRIPE</button>
  </div>

  <div class="controls">
    <button id="play-again">Play again</button>
  </div>

  <!-- Game-over centre card: pointer-events:none so canvas clicks still
       restart; draw() flips display to flex only while state.gameOver. -->
  <div id="gameover" style="display:none;">
    <span class="go-label">Game over</span>
    <span class="go-name" id="go-name"></span>
  </div>
</div>

<!-- Classic <script src> modules, shared via window.Poole.
     Order matters (each module depends on the ones before it). THREE.js must
     load first; the 3D renderer (webgl3d.js) loads after UI. -->
<script src="lib/three.min.js"></script>
<script src="src/config.js?v=20260930h"></script>
<script src="src/vec.js"></script>
<script src="src/ball.js"></script>
<script src="src/table.js"></script>
<script src="src/physics.js"></script>
<script src="src/rules.js"></script>
<script src="src/player.js"></script>
<script src="src/bot.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/noise.js?v=20260929e"></script>
        <script src="src/webgl3d.js?v=20260930l"></script>
       <script src="src/sound.js"></script>
      <script src="src/character.js?v=20261001e"></script>
      <script src="src/viewer.js?v=20261001c"></script>
     <script src="src/menu.js?v=20260930q"></script>
    <script src="src/game.js?v=20260930j"></script>
<script src="src/main.js?v=20260930m"></script>
</body>
</html>
